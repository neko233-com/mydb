# Public HTTPS endpoint; protect this credential file with service-only ACLs.
scrape_configs:
  - job_name: mydb
    scrape_interval: 15s
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/mydb-metrics-token
    static_configs:
      - targets: [db-metrics.example.com]

rule_files:
  - /etc/prometheus/mydb-alerts.yml
