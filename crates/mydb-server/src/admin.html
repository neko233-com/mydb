<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyDB SQL Workspace</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--surface:rgba(28,29,33,.88);--panel:#1c1d21;--line:rgba(255,255,255,.11);--text:#f5f5f7;--muted:#a1a1a6;--accent:#0a84ff;--accent2:#64d2ff;--cyan:var(--accent);--cyan2:var(--accent2);--ok:#30d158;--danger:#ff453a;--orange:#ff9f0a;--pink:#ff7ab2;--purple:#bf5af2;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;--sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% -20%,#1a2433 0,#0b0d10 48%);color:var(--text);font:14px var(--sans);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:rgba(48,49,54,.72);border-radius:9px;padding:9px 13px;transition:background .16s ease,border-color .16s ease,transform .1s ease}button:hover{border-color:rgba(10,132,255,.65);background:rgba(58,60,66,.92)}button:active{transform:scale(.98)}.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;box-shadow:0 5px 18px rgba(10,132,255,.2)}.primary:hover{background:#409cff;border-color:#409cff}
    .login{height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 12%,#203b58 0,transparent 35%),var(--bg)}.login-card{width:min(390px,calc(100vw - 40px));border:1px solid var(--line);background:rgba(28,29,33,.88);backdrop-filter:blur(24px) saturate(140%);padding:34px;border-radius:16px;box-shadow:0 24px 80px #0009}.brand{font-size:25px;font-weight:800;letter-spacing:-1px;color:var(--accent2)}.login h1{font-size:22px;margin:22px 0 8px;letter-spacing:-.02em}.login p{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:var(--muted)}.field input,.db-input{background:rgba(12,13,16,.78);border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none}.field input:focus,.db-input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.18)}.login .primary{width:100%;margin-top:10px}.error{color:var(--danger);min-height:20px;margin-top:14px;font-size:12px}
    .app{display:grid;grid-template-rows:58px 1fr;height:100vh}.topbar{display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(20,21,25,.78);backdrop-filter:blur(18px) saturate(150%)}.topbar .brand{width:201px;padding-left:21px;font-size:22px}.connection{display:flex;align-items:center;gap:10px;color:var(--text)}.dot{width:9px;height:9px;background:var(--ok);border-radius:50%;box-shadow:0 0 12px rgba(48,209,88,.8)}.version{color:var(--muted);font-size:12px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:16px;padding-right:18px;color:var(--muted)}.user{color:var(--text);display:flex;align-items:center;gap:8px}.avatar{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#3a3a40;color:var(--accent2);font-weight:700;font-size:12px}
    .workspace{display:grid;grid-template-columns:201px minmax(0,1fr) 338px;min-height:0}.nav{border-right:1px solid var(--line);padding:14px 9px;background:rgba(20,21,25,.64)}.nav button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border-color:transparent;background:transparent;color:var(--muted);margin:2px 0}.nav button.active,.nav button:hover{background:rgba(58,60,66,.72);border-color:transparent;color:var(--text)}.nav button.active{color:var(--accent2)}.nav-icon{width:18px;text-align:center;font-size:17px}.collapse{margin-top:auto!important;position:absolute;bottom:18px;width:182px!important}
    .main{min-width:0;display:grid;grid-template-rows:47px 1fr 40%;background:linear-gradient(180deg,#13161c,#0b0d10)}.tabs{display:flex;align-items:end;border-bottom:1px solid var(--line);padding-left:10px}.tab{height:39px;padding:11px 17px;border:1px solid var(--line);border-bottom:0;background:rgba(37,38,43,.72);border-radius:10px 10px 0 0;display:flex;gap:12px;align-items:center}.tab i{width:7px;height:7px;border-radius:50%;background:var(--accent)}.editor{min-height:0;display:grid;grid-template-rows:55px 1fr}.toolbar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 18px}.toolbar button{padding:7px 12px}.toolbar .spacer{flex:1}.toolbar select{background:rgba(28,29,33,.84);border:1px solid var(--line);border-radius:9px;padding:7px}.editor-body{position:relative;min-height:0;padding:16px 20px;display:flex;overflow:hidden}.line-count{position:absolute;top:18px;left:20px;color:#636366;text-align:right;line-height:1.75;font:13px/1.75 var(--mono);user-select:none}.editor-stack{position:relative;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden}.sql{width:100%;height:100%;resize:none;background:transparent;border:0;outline:0;padding:0 0 0 43px;color:#d1d1d6;font:14px/1.75 var(--mono);tab-size:2}.sql-highlight{position:absolute;inset:0;margin:0;overflow:auto;pointer-events:none;scrollbar-width:none;white-space:pre-wrap;overflow-wrap:break-word}.sql-highlight::-webkit-scrollbar{display:none}.sql-input{position:absolute;inset:0;z-index:1;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--text);selection-background-color:rgba(10,132,255,.35)}.sql-input::selection{background:rgba(10,132,255,.35);color:transparent}.sql-token-keyword{color:#ff7ab2}.sql-token-function{color:#64d2ff}.sql-token-string{color:#ff9f0a}.sql-token-number{color:#bf5af2}.sql-token-comment{color:#8e8e93;font-style:italic}.sql-token-constant{color:#5ac8fa}.sql-token-operator{color:#ff375f}.statusbar{position:absolute;bottom:8px;left:20px;color:var(--muted);font:11px var(--mono)}.results{min-height:0;border-top:1px solid var(--line);display:grid;grid-template-rows:39px 1fr 34px}.result-tabs{display:flex;gap:28px;align-items:end;padding:0 18px}.result-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0;padding:9px 1px;color:var(--muted)}.result-tabs button.active{color:var(--text);border-bottom-color:var(--accent)}.table-wrap{overflow:auto;padding:0 12px}.result-table{border-collapse:collapse;width:100%;font-size:12px}.result-table th,.result-table td{border:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap}.result-table th{color:var(--muted);font-weight:500;background:rgba(37,38,43,.86);position:sticky;top:0}.result-table td{color:#d1d1d6}.result-footer{display:flex;align-items:center;padding:0 18px;color:var(--muted);font-size:11px}.schema{border-left:1px solid var(--line);background:rgba(20,21,25,.64);display:grid;grid-template-rows:47px 45px 1fr 270px;min-height:0}.schema-head{display:flex;align-items:center;padding:0 17px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line)}.schema-search{padding:9px 14px}.schema-search input{width:100%;background:rgba(12,13,16,.78);border:1px solid var(--line);border-radius:9px;padding:8px 10px}.tree{padding:6px 10px;overflow:auto}.tree details{margin:3px 0}.tree summary{cursor:pointer;list-style:none;padding:7px 8px;color:#d1d1d6}.tree summary::-webkit-details-marker{display:none}.tree summary:before{content:'›';display:inline-block;width:18px;color:var(--muted)}.tree details[open]>summary:before{content:'⌄'}.tree .child{padding:6px 8px 6px 31px;color:var(--muted);cursor:pointer}.tree .child:hover,.tree .selected{color:var(--accent2);background:rgba(10,132,255,.14)}.inspector{border-top:1px solid var(--line);padding:15px 18px;overflow:auto}.inspector h3{font-size:14px;margin:0 0 15px}.inspector-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted);font:12px var(--mono)}.inspector-row b{color:#d1d1d6;font-weight:500}
    .hidden{display:none!important}@media(max-width:950px){.workspace{grid-template-columns:62px minmax(0,1fr)}.nav{padding:10px 7px}.nav button{justify-content:center}.nav button span:not(.nav-icon){display:none}.nav .brand{display:none}.collapse{width:45px!important}.schema{display:none}.topbar .brand{width:62px;padding-left:13px;font-size:0}.topbar .brand:after{content:'M';font-size:22px}.connection{font-size:12px}}@media(max-width:640px){.top-actions .version,.top-actions .help{display:none}.toolbar{padding:8px}.toolbar button:not(.primary){display:none}.editor-body{padding-left:9px}.line-count{display:none}.sql{padding-left:0;font-size:12px}.main{grid-template-rows:47px 1fr 42%}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <form id="login-form" class="login-card">
      <div class="brand">MyDB</div><h1 data-i18n="loginTitle">SQL Workspace</h1><p data-i18n="loginSubtitle">Sign in to manage your database server.</p>
      <div class="field"><label for="username" data-i18n="account">ACCOUNT</label><input id="username" autocomplete="username" required value="root"></div>
      <div class="field"><label for="password" data-i18n="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit" data-i18n="signIn">Sign in</button><div id="login-error" class="error"></div>
      <div class="field"><label for="login-locale" data-i18n="language">LANGUAGE</label><select id="login-locale" class="db-input"><option value="auto">Auto</option><option value="zh">中文</option><option value="en">English</option></select></div>
    </form>
  </section>
  <section id="app" class="app hidden">
    <header class="topbar"><div class="brand">MyDB</div><div class="connection"><span class="dot"></span><b data-i18n="localServer">Local MyDB Server</b><span class="version" id="server-version">8.4</span></div><div class="top-actions"><span class="version" id="query-status">Ready</span><select id="app-locale" class="db-input" aria-label="Language"><option value="auto">Auto</option><option value="zh">中文</option><option value="en">English</option></select><a class="help" href="/admin/doc" target="_blank" data-i18n="docs">Docs</a><span id="signed-user" class="user"><span class="avatar">R</span>admin⌄</span></div></header>
    <div class="workspace">
      <nav class="nav"><button class="active"><span class="nav-icon">⌘</span><span data-i18n="sqlWorkspace">SQL Workspace</span></button><button><span class="nav-icon">▣</span><span data-i18n="databases">Databases</span></button><button><span class="nav-icon">♙</span><span data-i18n="usersRoles">Users &amp; Roles</span></button><button><span class="nav-icon">↥</span><span data-i18n="backups">Backups</span></button><button><span class="nav-icon">▥</span><span data-i18n="metrics">Metrics</span></button><button id="logout" class="collapse"><span class="nav-icon">‹</span><span data-i18n="signOut">Sign out</span></button></nav>
      <main class="main">
        <div class="tabs"><div class="tab"><span>&lt;/&gt;</span><span data-i18n="query1">Query 1</span><i></i><button id="new-query" title="New query">+</button></div></div>
        <section class="editor"><div class="toolbar"><button id="run" class="primary">▶&nbsp; <span data-i18n="run">Run</span></button><button id="explain">⊕&nbsp; <span data-i18n="explain">Explain</span></button><button id="format">☷&nbsp; <span data-i18n="format">Format</span></button><button id="clear">▢&nbsp; <span data-i18n="clear">Clear</span></button><span class="spacer"></span><select id="limit"><option data-i18n="limit1000">Limit 1000</option><option data-i18n="limit100">Limit 100</option><option data-i18n="noLimit">不限制</option></select><span id="saved" class="version" data-i18n="saved">✓ Saved</span></div><div class="editor-body"><div id="line-count" class="line-count"></div><div class="editor-stack"><pre id="sql-highlight" class="sql sql-highlight" aria-hidden="true"></pre><textarea id="sql" class="sql sql-input" spellcheck="false">SELECT TABLE_SCHEMA, TABLE_NAME
FROM information_schema.TABLES
ORDER BY TABLE_SCHEMA, TABLE_NAME
LIMIT 50;</textarea></div><div class="statusbar">Ln 1, Col 1&nbsp;&nbsp;&nbsp; Spaces: 2&nbsp;&nbsp;&nbsp; UTF-8&nbsp;&nbsp;&nbsp; MySQL <span style="color:var(--ok)">✓ No issues</span></div></div></section>
        <section class="results"><div class="result-tabs"><button class="active" data-i18n="results">Results</button><button data-i18n="messages">Messages</button><button data-i18n="explain">Explain</button></div><div class="table-wrap"><table id="result-table" class="result-table"><tbody><tr><td style="color:var(--muted)" data-i18n="runQueryHint">Run a query to view results.</td></tr></tbody></table></div><div id="result-footer" class="result-footer" data-i18n="noQuery">No query executed</div></section>
      </main>
       <aside class="schema"><div class="schema-head"><span data-i18n="schemaExplorer">Schema Explorer</span> <span class="spacer"></span><button id="schema-refresh" type="button" title="Refresh">↻</button></div><div class="schema-search"><input id="schema-search" data-i18n-placeholder="searchSchemas" placeholder="Search schemas, tables, columns..."></div><div id="tree" class="tree"></div><div class="inspector" id="inspector"><h3 data-i18n="tableInfo">Select a table</h3></div></aside>
    </div>
  </section>
  <script>
    (()=>{
      const $=id=>document.getElementById(id);
      const translations={
        en:{loginTitle:'SQL Workspace',loginSubtitle:'Sign in to manage your database server.',account:'ACCOUNT',password:'PASSWORD',signIn:'Sign in',language:'LANGUAGE',localServer:'Local MyDB Server',docs:'Docs',sqlWorkspace:'SQL Workspace',databases:'Databases',usersRoles:'Users & Roles',backups:'Backups',metrics:'Metrics',signOut:'Sign out',query1:'Query 1',run:'Run',explain:'Explain',format:'Format',clear:'Clear',limit1000:'Limit 1000',limit100:'Limit 100',noLimit:'No limit',saved:'✓ Saved',results:'Results',messages:'Messages',runQueryHint:'Run a query to view results.',noQuery:'No query executed',schemaExplorer:'Schema Explorer',searchSchemas:'Search schemas, tables, columns...',tables:'Tables',views:'Views',storedProcedures:'Stored Procedures',tableInfo:'Table: information_schema.TABLES',ready:'Ready',running:'Running…',executed:'Executed in {ms} ms',rowsReturned:'{count} rows returned',resultSets:'{count} result sets',affected:'Executed successfully · {count} rows affected',queryFailed:'Query failed',sessionExpired:'Session expired',signingIn:'Signing in…'},
        zh:{loginTitle:'SQL 工作台',loginSubtitle:'登录以管理数据库服务。',account:'账号',password:'密码',signIn:'登录',language:'语言',localServer:'本机 MyDB 服务',docs:'文档',sqlWorkspace:'SQL 工作台',databases:'数据库',usersRoles:'用户与角色',backups:'备份',metrics:'指标',signOut:'退出登录',query1:'查询 1',run:'运行',explain:'解释',format:'格式化',clear:'清空',limit1000:'限制 1000',limit100:'限制 100',noLimit:'不限制',saved:'✓ 已保存',results:'结果',messages:'消息',runQueryHint:'运行查询后显示结果。',noQuery:'尚未执行查询',schemaExplorer:'架构浏览器',searchSchemas:'搜索数据库、表、列...',tables:'表',views:'视图',storedProcedures:'存储过程',tableInfo:'表：information_schema.TABLES',ready:'就绪',running:'执行中…',executed:'已执行，用时 {ms} ms',rowsReturned:'返回 {count} 行',resultSets:'{count} 个结果集',affected:'执行成功 · 影响 {count} 行',queryFailed:'查询失败',sessionExpired:'会话已过期',signingIn:'登录中…'}
      };
      const state={token:localStorage.getItem('mydb-admin-token'),localePreference:localStorage.getItem('mydb-admin-locale')||'auto',locale:'en'};
      const effectiveLocale=()=>state.localePreference==='auto'?(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en':state.localePreference;
      const t=(key,vars={})=>(translations[state.locale][key]||translations.en[key]||key).replace(/\{(\w+)\}/g,(_,name)=>vars[name]??'');
      function applyLocale(preference=state.localePreference){state.localePreference=preference;state.locale=effectiveLocale();document.documentElement.lang=state.locale;document.querySelectorAll('[data-i18n]').forEach(node=>{node.textContent=t(node.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(node=>{node.placeholder=t(node.dataset.i18nPlaceholder)});['login-locale','app-locale'].forEach(id=>{if($(id))$(id).value=state.localePreference});$('query-status').textContent=t('ready')}
      const showApp=()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden')};
      const showLogin=()=>{$('app').classList.add('hidden');$('login').classList.remove('hidden');state.token=null;localStorage.removeItem('mydb-admin-token')};
      async function api(path,options={}){options.headers=Object.assign({'Content-Type':'application/json'},options.headers||{});if(state.token)options.headers.Authorization='Bearer '+state.token;const r=await fetch(path,options);if(r.status===401){showLogin();throw Error(t('sessionExpired'))};const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.error||body.message||'Request failed ('+r.status+')');return body}
      const sqlKeywords=new Set('SELECT FROM WHERE GROUP BY ORDER HAVING LIMIT OFFSET JOIN INNER LEFT RIGHT FULL OUTER CROSS ON AS DISTINCT ALL UNION INTERSECT EXCEPT INSERT INTO VALUES UPDATE SET DELETE REPLACE CREATE ALTER DROP TRUNCATE TABLE DATABASE SCHEMA INDEX KEY PRIMARY UNIQUE FOREIGN REFERENCES CONSTRAINT CHECK DEFAULT NULL NOT AND OR IN IS LIKE BETWEEN EXISTS CASE WHEN THEN ELSE END ASC DESC WITH RECURSIVE VIEW PROCEDURE FUNCTION TRIGGER EVENT CALL BEGIN COMMIT ROLLBACK START TRANSACTION FOR UPDATE SHARE NOWAIT SKIP LOCKED USE SHOW DESCRIBE EXPLAIN GRANT REVOKE ANALYZE OPTIMIZE ENGINE PARTITION'.split(' '));
      const sqlConstants=new Set(['NULL','TRUE','FALSE','CURRENT_DATE','CURRENT_TIME','CURRENT_TIMESTAMP','INTERVAL']);
      const escapeHtml=value=>value.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const token=(kind,value)=>'<span class="sql-token-'+kind+'">'+escapeHtml(value)+'</span>';
      function highlightSql(source){let html='',i=0;while(i<source.length){const ch=source[i];if(source.startsWith('--',i)||ch==='#'){const start=i;while(i<source.length&&source[i]!='\n')i++;html+=token('comment',source.slice(start,i));continue}if(source.startsWith('/*',i)){const start=i;i+=2;while(i<source.length&&!source.startsWith('*/',i))i++;i=Math.min(source.length,i+2);html+=token('comment',source.slice(start,i));continue}if(ch==='\''||ch==='"'||ch==='`'){const quote=ch,start=i; i++;while(i<source.length){if(source[i]==='\\'){i+=2;continue}if(source[i]===quote){if(source[i+1]===quote){i+=2;continue}i++;break}i++}html+=token(quote==='`'?'identifier':'string',source.slice(start,i));continue}if(/[0-9]/.test(ch)){const start=i;i++;while(i<source.length&&/[0-9A-Fa-fxX.eE+-]/.test(source[i]))i++;html+=token('number',source.slice(start,i));continue}if(/[A-Za-z_$]/.test(ch)){const start=i;i++;while(i<source.length&&/[A-Za-z0-9_$]/.test(source[i]))i++;const word=source.slice(start,i),upper=word.toUpperCase();let next=i;while(next<source.length&&/\s/.test(source[next]))next++;html+=sqlConstants.has(upper)?token('constant',word):sqlKeywords.has(upper)?token('keyword',word):source[next]==='('?token('function',word):escapeHtml(word);continue}if(/[+\-*\/%=<>!|&]/.test(ch)){html+=token('operator',ch);i++;continue}html+=escapeHtml(ch);i++}return html||' '}
      function syncEditorScroll(){const input=$('sql'),highlight=$('sql-highlight');highlight.scrollTop=input.scrollTop;highlight.scrollLeft=input.scrollLeft}
      function renderEditor(){const value=$('sql').value;const n=value.split('\n').length;$('line-count').innerHTML=Array.from({length:n},(_,i)=>i+1).join('<br>');$('sql-highlight').innerHTML=highlightSql(value);syncEditorScroll()}
      function renderResult(body){const set=body.result_sets&&body.result_sets[0];const table=$('result-table');table.innerHTML='';if(!set){$('result-footer').textContent=t('affected',{count:body.affected_rows});return}const head=document.createElement('tr');set.columns.forEach(c=>{const th=document.createElement('th');th.textContent=c;head.appendChild(th)});table.appendChild(head);set.rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(v=>{const td=document.createElement('td');td.textContent=v===null?'NULL':v;td.style.color=v===null?'#718096':'';tr.appendChild(td)});table.appendChild(tr)});$('result-footer').textContent=t('rowsReturned',{count:set.rows.length})+(body.result_sets.length>1?' · '+t('resultSets',{count:body.result_sets.length}):'')}
      function renderError(message){const table=$('result-table');table.innerHTML='';const row=document.createElement('tr'),cell=document.createElement('td');cell.style.color='var(--danger)';cell.textContent=message;row.appendChild(cell);table.appendChild(row)}
      const queryRequest=sql=>api('/api/v1/sql/query',{method:'POST',body:JSON.stringify({sql,database:null})});
      const resultRows=body=>body?.result_sets?.[0]?.rows||[];
      const sqlString=value=>"'"+String(value).replaceAll("'","''")+"'";
      function clearInspector(){const inspector=$('inspector');inspector.textContent='';const heading=document.createElement('h3');heading.textContent=t('tableInfo');inspector.appendChild(heading)}
      function renderInspector(schema,table,columns){const inspector=$('inspector');inspector.textContent='';const heading=document.createElement('h3');heading.textContent='Table: '+schema+'.'+table;inspector.appendChild(heading);columns.forEach(column=>{const row=document.createElement('div');row.className='inspector-row';const name=document.createElement('b');name.textContent=String(column[0]??'');const type=document.createElement('span');type.textContent=String(column[1]??'');row.append(name,type);inspector.appendChild(row)})}
      async function selectTable(schema,table){try{const body=await queryRequest('SELECT COLUMN_NAME,DATA_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='+sqlString(schema)+' AND TABLE_NAME='+sqlString(table)+' ORDER BY ORDINAL_POSITION');renderInspector(schema,table,resultRows(body))}catch(err){renderError(err.message)}}
      function renderSchemaTree(schemas,rows){const tree=$('tree');tree.textContent='';const grouped=new Map(schemas.map(schema=>[schema,[]]));rows.forEach(row=>{const schema=String(row[0]??'');const table=String(row[1]??'');const type=String(row[2]??'');if(!grouped.has(schema))grouped.set(schema,[]);grouped.get(schema).push({table,type})});grouped.forEach((tables,schema)=>{const database=document.createElement('details');database.open=true;const databaseSummary=document.createElement('summary');databaseSummary.textContent='◉ '+schema;database.appendChild(databaseSummary);const tableGroup=document.createElement('details');tableGroup.open=true;const tableSummary=document.createElement('summary');tableSummary.textContent='▦ '+t('tables');tableGroup.appendChild(tableSummary);tables.sort((a,b)=>a.table.localeCompare(b.table)).forEach(entry=>{const child=document.createElement('div');child.className='child';child.textContent=(entry.type==='VIEW'?'◫ ':'▦ ')+entry.table;child.onclick=()=>selectTable(schema,entry.table);tableGroup.appendChild(child)});database.appendChild(tableGroup);tree.appendChild(database)})}
      async function refreshSchema(){try{const schemas=[...new Set(resultRows(await queryRequest('SHOW DATABASES')).map(row=>String(row[0]??'')).filter(Boolean))];const body=await queryRequest('SELECT TABLE_SCHEMA,TABLE_NAME,TABLE_TYPE FROM information_schema.TABLES ORDER BY TABLE_SCHEMA,TABLE_NAME');const allowed=new Set(schemas);renderSchemaTree(schemas,resultRows(body).filter(row=>allowed.has(String(row[0]??''))));clearInspector()}catch(err){renderError(err.message)}}
      $('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-error').textContent=t('signingIn');try{const r=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});state.token=r.token;localStorage.setItem('mydb-admin-token',r.token);$('signed-user').innerHTML='<span class="avatar">'+$('username').value.slice(0,1).toUpperCase()+'</span>'+r.username+'⌄';showApp();await refreshSchema()}catch(err){$('login-error').textContent=err.message}});
      async function run(sql){const started=performance.now();$('query-status').textContent=t('running');try{const r=await queryRequest(sql||$('sql').value);renderResult(r);$('query-status').textContent=t('executed',{ms:(performance.now()-started).toFixed(1)});return r}catch(err){renderError(err.message);$('result-footer').textContent=t('queryFailed');$('query-status').textContent=t('queryFailed');return null}}
      ['login-locale','app-locale'].forEach(id=>$(id).addEventListener('change',e=>{localStorage.setItem('mydb-admin-locale',e.target.value);applyLocale(e.target.value)}));
      $('run').onclick=()=>run();$('clear').onclick=()=>{$('sql').value='';renderEditor()};$('new-query').onclick=()=>{$('sql').value='SELECT 1;';renderEditor()};$('format').onclick=()=>{$('sql').value=$('sql').value.replace(/\s+/g,' ').replace(/\s*,\s*/g,', ').replace(/\s+(FROM|WHERE|GROUP BY|ORDER BY|LIMIT)\s+/gi,'\n$1 ');renderEditor()};$('explain').onclick=()=>run('EXPLAIN '+$('sql').value);$('schema-refresh').onclick=refreshSchema;$('logout').onclick=async()=>{try{await api('/api/v1/auth/logout',{method:'POST'})}catch(_){}showLogin()};$('sql').addEventListener('input',renderEditor);$('sql').addEventListener('scroll',syncEditorScroll);$('sql').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});applyLocale();renderEditor();if(state.token){showApp();refreshSchema()}
    })();
  </script>
</body>
</html>
